<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Display → body ramp, tuned for UI density" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
  .row:last-child { border-bottom: none; }
  .label { font-family: var(--font-label); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); width: 96px; flex: none; }
  .sample { color: var(--text-primary); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .disp { font-family: var(--font-display); letter-spacing: -0.01em; }
  .sans { font-family: var(--font-sans); letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="row"><span class="label">4xl · 52</span><span class="sample disp" style="font-size:var(--text-4xl);font-weight:700">Today</span></div>
  <div class="row"><span class="label">3xl · 40</span><span class="sample disp" style="font-size:var(--text-3xl);font-weight:700">A clearer day</span></div>
  <div class="row"><span class="label">2xl · 31</span><span class="sample disp" style="font-size:var(--text-2xl);font-weight:700">Weekly review</span></div>
  <div class="row"><span class="label">xl · 24</span><span class="sample disp" style="font-size:var(--text-xl);font-weight:600">Morning pages</span></div>
  <div class="row"><span class="label">lg · 20</span><span class="sample sans" style="font-size:var(--text-lg);font-weight:600">Section heading</span></div>
  <div class="row"><span class="label">md · 17</span><span class="sample sans" style="font-size:var(--text-md)">Body large — comfortable reading</span></div>
  <div class="row"><span class="label">base · 15</span><span class="sample sans" style="font-size:var(--text-base)">Default body and entry text</span></div>
  <div class="row"><span class="label">sm · 13</span><span class="sample sans" style="font-size:var(--text-sm);color:var(--text-secondary)">Secondary labels and hints</span></div>
  <div class="row"><span class="label">xs · 12</span><span class="sample sans" style="font-size:var(--text-xs);color:var(--text-tertiary)">Fine print and counts</span></div>
</body>
</html>
