<!-- @dsCard group="Colors" viewport="700x130" name="Status colors" subtitle="Success, warning, danger, info — subtle + solid" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .status { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .status .solid { height: 38px; display: flex; align-items: center; padding: 0 12px; color: #fff; font-weight: 600; font-size: 13px; }
  .status .subtle { height: 30px; }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); margin-top: 7px; letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div>
    <div class="status"><div class="solid" style="background:var(--color-success)">Success</div><div class="subtle" style="background:var(--color-success-subtle)"></div></div>
    <div class="name">--color-success</div>
  </div>
  <div>
    <div class="status"><div class="solid" style="background:var(--color-warning)">Warning</div><div class="subtle" style="background:var(--color-warning-subtle)"></div></div>
    <div class="name">--color-warning</div>
  </div>
  <div>
    <div class="status"><div class="solid" style="background:var(--color-danger)">Danger</div><div class="subtle" style="background:var(--color-danger-subtle)"></div></div>
    <div class="name">--color-danger</div>
  </div>
  <div>
    <div class="status"><div class="solid" style="background:var(--color-info)">Info</div><div class="subtle" style="background:var(--color-info-subtle)"></div></div>
    <div class="name">--color-info</div>
  </div>
</body>
</html>
