<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ramp" subtitle="13-step near-neutral gray scale, faint cool cast" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); }
  .ramp { display: grid; grid-template-columns: repeat(13, 1fr); gap: 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .ramp > div { height: 56px; }
  .labels { display: grid; grid-template-columns: repeat(13, 1fr); gap: 0; margin-top: 8px; }
  .labels span { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); text-align: center; }
</style>
</head>
<body>
  <div class="ramp">
    <div style="background:var(--neutral-0)"></div>
    <div style="background:var(--neutral-50)"></div>
    <div style="background:var(--neutral-100)"></div>
    <div style="background:var(--neutral-150)"></div>
    <div style="background:var(--neutral-200)"></div>
    <div style="background:var(--neutral-300)"></div>
    <div style="background:var(--neutral-400)"></div>
    <div style="background:var(--neutral-500)"></div>
    <div style="background:var(--neutral-600)"></div>
    <div style="background:var(--neutral-700)"></div>
    <div style="background:var(--neutral-800)"></div>
    <div style="background:var(--neutral-900)"></div>
    <div style="background:var(--neutral-950)"></div>
  </div>
  <div class="labels">
    <span>0</span><span>50</span><span>100</span><span>150</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>800</span><span>900</span><span>950</span>
  </div>
</body>
</html>
