<!-- @dsCard group="Colors" viewport="700x160" name="Accent themes" subtitle="Seven user-selectable accent palettes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); }
  .themes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px; }
  .swatch { border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--border-subtle); }
  .swatch .main { height: 46px; }
  .swatch .steps { display: grid; grid-template-columns: repeat(4, 1fr); height: 16px; }
  .name { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 7px; text-transform: uppercase; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="themes">
    <div>
      <div class="swatch" data-accent="ink"><div class="main" style="background:var(--accent-500)"></div><div class="steps"><div style="background:var(--accent-200)"></div><div style="background:var(--accent-400)"></div><div style="background:var(--accent-600)"></div><div style="background:var(--accent-800)"></div></div></div>
      <div class="name">Ink ·default</div>
    </div>
    <div>
      <div class="swatch" data-accent="sage"><div class="main" style="background:var(--accent-500)"></div><div class="steps"><div style="background:var(--accent-200)"></div><div style="background:var(--accent-400)"></div><div style="background:var(--accent-600)"></div><div style="background:var(--accent-800)"></div></div></div>
      <div class="name">Sage</div>
    </div>
    <div>
      <div class="swatch" data-accent="clay"><div class="main" style="background:var(--accent-500)"></div><div class="steps"><div style="background:var(--accent-200)"></div><div style="background:var(--accent-400)"></div><div style="background:var(--accent-600)"></div><div style="background:var(--accent-800)"></div></div></div>
      <div class="name">Clay</div>
    </div>
    <div>
      <div class="swatch" data-accent="amber"><div class="main" style="background:var(--accent-500)"></div><div class="steps"><div style="background:var(--accent-200)"></div><div style="background:var(--accent-400)"></div><div style="background:var(--accent-600)"></div><div style="background:var(--accent-800)"></div></div></div>
      <div class="name">Amber</div>
    </div>
    <div>
      <div class="swatch" data-accent="teal"><div class="main" style="background:var(--accent-500)"></div><div class="steps"><div style="background:var(--accent-200)"></div><div style="background:var(--accent-400)"></div><div style="background:var(--accent-600)"></div><div style="background:var(--accent-800)"></div></div></div>
      <div class="name">Teal</div>
    </div>
    <div>
      <div class="swatch" data-accent="rose"><div class="main" style="background:var(--accent-500)"></div><div class="steps"><div style="background:var(--accent-200)"></div><div style="background:var(--accent-400)"></div><div style="background:var(--accent-600)"></div><div style="background:var(--accent-800)"></div></div></div>
      <div class="name">Rose</div>
    </div>
    <div>
      <div class="swatch" data-accent="slate"><div class="main" style="background:var(--accent-500)"></div><div class="steps"><div style="background:var(--accent-200)"></div><div style="background:var(--accent-400)"></div><div style="background:var(--accent-600)"></div><div style="background:var(--accent-800)"></div></div></div>
      <div class="name">Slate</div>
    </div>
  </div>
</body>
</html>
