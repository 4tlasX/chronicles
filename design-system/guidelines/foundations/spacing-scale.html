<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid, named steps" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); display: flex; align-items: flex-end; gap: 18px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--color-accent); border-radius: var(--radius-xs); width: 100%; }
  .box { display: flex; align-items: flex-end; height: 64px; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); font-weight: 500; }
</style>
</head>
<body>
  <div class="step"><div class="box"><div class="bar" style="width:4px;height:4px"></div></div><div class="px">4</div><div class="label">1</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:8px;height:8px"></div></div><div class="px">8</div><div class="label">2</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:12px;height:12px"></div></div><div class="px">12</div><div class="label">3</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:16px;height:16px"></div></div><div class="px">16</div><div class="label">4</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:20px;height:20px"></div></div><div class="px">20</div><div class="label">5</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:24px;height:24px"></div></div><div class="px">24</div><div class="label">6</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:32px;height:32px"></div></div><div class="px">32</div><div class="label">8</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:40px;height:40px"></div></div><div class="px">40</div><div class="label">10</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:48px;height:48px"></div></div><div class="px">48</div><div class="label">12</div></div>
  <div class="step"><div class="box"><div class="bar" style="width:64px;height:64px"></div></div><div class="px">64</div><div class="label">16</div></div>
</body>
</html>
