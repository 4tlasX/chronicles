<!-- @dsCard group="Type" viewport="700x180" name="Typefaces" subtitle="Work Sans (display) + Open Sans (UI & body) — friendly sans on sans" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .spec { border-left: 2px solid var(--border-accent); padding-left: 18px; }
  .eyebrow { font-family: var(--font-label); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 600; }
  .big { font-family: var(--font-display); font-size: 42px; font-weight: 600; letter-spacing: -0.02em; color: var(--text-primary); line-height: 1.05; margin: 8px 0 4px; }
  .big em { font-weight: 400; font-style: normal; color: var(--color-accent); }
  .body { font-family: var(--font-sans); font-size: 34px; font-weight: 600; letter-spacing: -0.01em; color: var(--text-primary); margin: 8px 0 4px; }
  .meta { font-size: 12px; color: var(--text-tertiary); }
  .weights { display: flex; gap: 14px; margin-top: 8px; font-size: 14px; color: var(--text-secondary); font-family: var(--font-sans); }
</style>
</head>
<body>
  <div class="spec">
    <div class="eyebrow">Display · Headings</div>
    <div class="big">Work <em>Sans</em></div>
    <div class="meta" style="font-family:var(--font-display);font-size:16px;color:var(--text-secondary);margin-top:8px">Aa Bb Cc &mdash; 400 · 500 · 600 · 700</div>
    <div class="meta" style="margin-top:8px">--font-display</div>
  </div>
  <div class="spec">
    <div class="eyebrow">Sans · UI &amp; Body</div>
    <div class="body">Open Sans</div>
    <div class="weights"><span style="font-weight:400">Regular</span><span style="font-weight:500">Medium</span><span style="font-weight:600">Semibold</span><span style="font-weight:700">Bold</span></div>
    <div class="meta" style="margin-top:10px">--font-sans · also labels &amp; metadata (uppercase, tracked)</div>
  </div>
</body>
</html>
