<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--bg-app); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .panel { display: flex; align-items: center; gap: 18px; padding: 20px 24px; border-radius: var(--radius-lg); border: 1px solid var(--border-subtle); }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup .name { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; color: var(--text-primary); }
  .mark { color: var(--color-accent); display: inline-flex; }
  .mark svg { width: 30px; height: 30px; }
</style>
</head>
<body>
  <div class="panel" style="background:var(--bg-surface)">
    <div class="lockup">
      <span class="mark"><svg viewBox="0 0 32 32" fill="none"><path d="M16 6 L26 16 L16 26 L6 16 Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="3.6" fill="currentColor"/></svg></span>
      <span class="name">Chronicles</span>
    </div>
  </div>
  <div class="panel" data-theme="dark" style="background:var(--bg-surface)">
    <div class="lockup">
      <span class="mark"><svg viewBox="0 0 32 32" fill="none"><path d="M16 6 L26 16 L16 26 L6 16 Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="3.6" fill="currentColor"/></svg></span>
      <span class="name">Chronicles</span>
    </div>
  </div>
</body>
</html>
