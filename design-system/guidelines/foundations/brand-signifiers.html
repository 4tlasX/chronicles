<!-- @dsCard group="Brand" viewport="700x200" name="Entry topics" subtitle="What Chronicles captures — and the markers that sort it" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sig { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); background: var(--bg-surface); }
  .glyph { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--color-accent-subtle); color: var(--color-accent); flex: none; }
  .glyph.plain { background: transparent; color: var(--text-primary); }
  .name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .desc { font-family: var(--font-label); font-size: 9.5px; color: var(--text-tertiary); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
  <div class="sig"><span class="glyph plain"><span class="ch-sig-task"></span></span><div><div class="name">Task</div><div class="desc">to do</div></div></div>
  <div class="sig"><span class="glyph plain"><span class="ch-sig-event"></span></span><div><div class="name">Event</div><div class="desc">on the calendar</div></div></div>
  <div class="sig"><span class="glyph plain"><span class="ch-sig-note"></span></span><div><div class="name">Note</div><div class="desc">to remember</div></div></div>
  <div class="sig"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/></svg></span><div><div class="name">Journal</div><div class="desc">reflection</div></div></div>
  <div class="sig"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.76-2-2-2H4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2v3z"/><path d="M14 21c3 0 7-1 7-8V5c0-1.25-.76-2-2-2h-4c-1.25 0-2 .75-2 2v6c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3z"/></svg></span><div><div class="name">Quote</div><div class="desc">worth keeping</div></div></div>
  <div class="sig"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21 1.18.54 2.03 2.03 2.03 3.79"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg></span><div><div class="name">Goal</div><div class="desc">to reach</div></div></div>
  <div class="sig"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></span><div><div class="name">Meal</div><div class="desc">to log</div></div></div>
  <div class="sig"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M10 2v2M14 2v2M6 2v2"/><path d="M16 8a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/></svg></span><div><div class="name">Recipe</div><div class="desc">to keep</div></div></div>
</body>
</html>
