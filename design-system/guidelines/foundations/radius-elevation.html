<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & elevation" subtitle="Sharp corners + flat panels; shadows only on floating overlays" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); display: grid; grid-template-columns: auto 1px 1fr; gap: 26px; align-items: center; }
  .group { display: flex; gap: 16px; align-items: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .r { width: 50px; height: 50px; background: var(--bg-surface); border: 1.5px solid var(--border-strong); }
  .panel { width: 64px; height: 50px; background: var(--bg-surface); border: 1px solid var(--border-default); }
  .s { width: 64px; height: 50px; background: var(--bg-surface); border: 1px solid var(--border-subtle); }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-tertiary); }
  .divider { background: var(--border-subtle); height: 86px; }
</style>
</head>
<body>
  <div class="group">
    <div class="item"><div class="r" style="border-radius:var(--radius-sm)"></div><div class="label">sm·2</div></div>
    <div class="item"><div class="r" style="border-radius:var(--radius-md)"></div><div class="label">md·3</div></div>
    <div class="item"><div class="r" style="border-radius:var(--radius-lg)"></div><div class="label">lg·4</div></div>
    <div class="item"><div class="r" style="border-radius:var(--radius-xl)"></div><div class="label">xl·6</div></div>
  </div>
  <div class="divider"></div>
  <div class="group">
    <div class="item"><div class="panel" style="border-radius:var(--radius-lg)"></div><div class="label">panel · flat</div></div>
    <div class="item"><div class="s" style="border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><div class="label">lg · menu</div></div>
    <div class="item"><div class="s" style="border-radius:var(--radius-xl);box-shadow:var(--shadow-xl)"></div><div class="label">xl · dialog</div></div>
  </div>
</body>
</html>
