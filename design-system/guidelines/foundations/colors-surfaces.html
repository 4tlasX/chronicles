<!-- @dsCard group="Colors" viewport="700x180" name="Semantic surfaces" subtitle="Light & dark surface, text & border tokens" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: var(--bg-app); display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .mode { border-radius: var(--radius-lg); border: 1px solid var(--border-default); overflow: hidden; }
  .mode__inner { background: var(--bg-app); padding: 14px; }
  .tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 10px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .surface { padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); display: flex; justify-content: space-between; align-items: center; }
  .surface span:first-child { color: var(--text-primary); font-size: 13px; font-weight: 500; }
  .surface span:last-child { color: var(--text-tertiary); font-size: 12px; }
  .mono { font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="mode">
    <div class="mode__inner">
      <div class="tag">Light</div>
      <div class="stack">
        <div class="surface" style="background:var(--bg-surface)"><span>bg-surface</span><span class="mono">card</span></div>
        <div class="surface" style="background:var(--bg-sunken)"><span>bg-sunken</span><span class="mono">well</span></div>
        <div class="surface" style="background:var(--bg-surface)"><span style="color:var(--text-secondary)">text-secondary</span><span class="mono">label</span></div>
      </div>
    </div>
  </div>
  <div class="mode" data-theme="dark">
    <div class="mode__inner">
      <div class="tag">Dark</div>
      <div class="stack">
        <div class="surface" style="background:var(--bg-surface)"><span>bg-surface</span><span class="mono">card</span></div>
        <div class="surface" style="background:var(--bg-sunken)"><span>bg-sunken</span><span class="mono">well</span></div>
        <div class="surface" style="background:var(--bg-surface)"><span style="color:var(--text-secondary)">text-secondary</span><span class="mono">label</span></div>
      </div>
    </div>
  </div>
</body>
</html>
