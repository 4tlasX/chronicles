<!-- @dsCard group="Components" viewport="700x320" name="Feedback — dialog, toast, banner, tooltip" subtitle="Overlays and contextual messaging" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Toast, Banner, Tooltip, IconButton, Dialog, Button } = window.ChroniclesDesignSystem_cefe3d;
  function Demo() {
    const [open, setOpen] = React.useState(false);
    return (
      <div>
        <div className="grid">
          <div className="stack">
            <span className="lbl">Banners</span>
            <Banner tone="info" title="Tip:">Press ⌘K to jump to any date.</Banner>
            <Banner tone="warning" title="3 overdue">Tasks from last week are waiting.</Banner>
            <span className="lbl" style={{marginTop:"6px"}}>Tooltip · Dialog</span>
            <div style={{display:"flex",gap:"12px",alignItems:"center"}}>
              <Tooltip label="Migrate to tomorrow"><IconButton icon="arrow-right" aria-label="Migrate" variant="outline" /></Tooltip>
              <Button variant="secondary" onClick={()=>setOpen(true)}>Open dialog</Button>
            </div>
          </div>
          <div className="stack">
            <span className="lbl">Toasts</span>
            <Toast tone="success" title="Entry saved" />
            <Toast tone="accent" title="3 tasks migrated" description="Moved to Mon, Jun 22" onClose={()=>{}} />
            <Toast tone="danger" title="Couldn't sync" description="Retrying…" />
          </div>
        </div>
        <Dialog open={open} onClose={()=>setOpen(false)} title="Move to next week?"
          description="Unfinished tasks will carry over to Monday, Jun 22."
          footer={<><Button variant="ghost" onClick={()=>setOpen(false)}>Cancel</Button><Button onClick={()=>setOpen(false)}>Migrate</Button></>} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
