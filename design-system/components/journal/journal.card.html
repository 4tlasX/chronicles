<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .wrap { max-width: 560px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Collection, BulletEntry, QuickAdd, IconButton } = window.ChroniclesDesignSystem_cefe3d;
  function Demo() {
    const [done, setDone] = React.useState({ a: true, b: false, c: false });
    const toggle = (k) => setDone(s => ({ ...s, [k]: !s[k] }));
    return (
      <div className="wrap">
        <Collection title="Today" date="WED · JUN 17" action={<IconButton icon="more-horizontal" aria-label="Options" size="sm" />}>
          <BulletEntry type="task" done={done.a} text="Send weekly review to the team" onToggle={()=>toggle("a")} time="08:40" tags={["work"]} />
          <BulletEntry type="task" priority accent done={done.b} text="Book dentist appointment" onToggle={()=>toggle("b")} />
          <BulletEntry type="event" text="Lunch with Sam" time="12:30" />
          <BulletEntry type="task" done={done.c} text="Draft Q3 goals" onToggle={()=>toggle("c")} trailing={<IconButton icon="arrow-right" aria-label="Migrate" size="sm" />} />
          <BulletEntry type="note" text="Idea: a monthly gratitude page" sub="Captured from Inbox" />
          <QuickAdd onAdd={()=>{}} />
        </Collection>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
