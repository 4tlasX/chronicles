<!-- @dsCard group="Components" viewport="700x440" name="Core — buttons, fields, controls" subtitle="Buttons, inputs, toggles, badges, avatars" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 22px; background: var(--bg-app); }
  .grid { display: flex; flex-direction: column; gap: 20px; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .col { display: flex; flex-direction: column; gap: 10px; max-width: 240px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); width: 100%; }
  .rowwrap { display: flex; gap: 28px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, Input, Checkbox, Switch, Badge, Tag, Avatar, SegmentedControl, AccentPicker } = window.ChroniclesDesignSystem_cefe3d;
  function Demo() {
    const [view, setView] = React.useState("week");
    const [accent, setAccent] = React.useState("ink");
    React.useEffect(() => { document.documentElement.dataset.accent = accent; }, [accent]);
    return (
      <div className="grid">
        <div className="group">
          <span className="lbl">Buttons</span>
          <Button variant="primary" icon="plus">New entry</Button>
          <Button variant="secondary">Cancel</Button>
          <Button variant="accentSoft" icon="sparkles">Reflect</Button>
          <Button variant="ghost" icon="settings">Settings</Button>
          <Button variant="danger">Delete</Button>
          <IconButton icon="more-horizontal" aria-label="More" variant="outline" />
        </div>
        <div className="rowwrap">
          <div className="col">
            <span className="lbl">Fields</span>
            <Input icon="search" placeholder="Search entries" />
            <Input label="Title" placeholder="Morning pages…" />
          </div>
          <div className="col">
            <span className="lbl">Controls</span>
            <Checkbox label="Carry over tasks" defaultChecked />
            <Switch label="Dark mode" />
            <SegmentedControl value={view} onChange={setView}
              options={[{value:"day",label:"Day"},{value:"week",label:"Week"},{value:"month",label:"Month"}]} />
          </div>
          <div className="col">
            <span className="lbl">Status &amp; people</span>
            <div className="group">
              <Badge tone="accent">Today</Badge>
              <Badge tone="success" dot>On track</Badge>
              <Badge tone="warning">Overdue</Badge>
            </div>
            <div className="group">
              <Tag>#health</Tag><Tag onRemove={()=>{}}>#work</Tag>
              <Avatar name="Maya Okonkwo" />
            </div>
          </div>
        </div>
        <div className="group">
          <span className="lbl">Accent themes</span>
          <AccentPicker value={accent} onChange={setAccent} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
