<!DOCTYPE html>
<html lang="en" data-accent="teal">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chronicles — Mobile</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-app); display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .phone {
    width: 390px; height: 844px; max-height: calc(100vh - 48px);
    background: var(--bg-surface); border-radius: 44px; overflow: hidden;
    box-shadow: var(--shadow-xl), 0 0 0 11px var(--neutral-900), 0 0 0 13px var(--neutral-700);
    position: relative; display: flex; flex-direction: column;
  }
  .notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 30px; background: var(--neutral-900); border-radius: 0 0 18px 18px; z-index: 30; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div id="root" class="screen"></div>
  </div>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
